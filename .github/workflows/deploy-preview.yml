name: Deploy Preview

# pull_request alone (no push): every branch with an open PR already fires
# pull_request's synchronize event on every commit. Merges to main are
# covered too, since the standing release PR (head: main, base: production)
# gets its own synchronize event whenever main updates.
on:
  pull_request: {}
  workflow_dispatch:
    inputs:
      force:
        description: Deploy site/cms even if turbo's affected-check finds no changes
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-site:
    name: Check site
    uses: ./.github/workflows/turbo-affected-check.yml
    with:
      package: site

  deploy-site:
    name: Deploy site to Vercel
    needs: check-site
    uses: ./.github/workflows/vercel-deploy.yml
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    with:
      vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_SITE }}
      should-deploy: ${{ needs.check-site.outputs.should_deploy == 'true' || inputs.force == true }}
      target: ${{ (github.head_ref || github.ref_name) == 'main' && 'staging' || '' }}

  check-cms:
    name: Check cms
    uses: ./.github/workflows/turbo-affected-check.yml
    with:
      package: cms

  deploy-cms:
    name: Deploy cms to Vercel
    needs: check-cms
    uses: ./.github/workflows/vercel-deploy.yml
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    with:
      vercel-project-id: ${{ vars.VERCEL_PROJECT_ID_CMS }}
      should-deploy: ${{ needs.check-cms.outputs.should_deploy == 'true' || inputs.force == true }}
      target: ${{ (github.head_ref || github.ref_name) == 'main' && 'staging' || '' }}
